- name: Authorize library in APF (dynamic).
  hosts: zos_host
  environment: "{{ environment_vars }}"
  gather_facts: false
  tasks:

    - name: Allocate library as PDSE if it does not already exist.
      ibm.ibm_zos_core.zos_data_set:
        name: "{{ library }}"
        type: pdse
        record_format: fb
        record_length: 80
        block_size: 0
        space_primary: 20
        space_secondary: 10
        space_type: cyl
        state: present

    - name: Ensure APF list is in dynamic format.
      ibm.ibm_zos_core.zos_apf:
        operation: set_dynamic

    - name: Get APF list for idempotency check.
      ibm.ibm_zos_core.zos_apf:
        operation: list
      register: apf_list

    - name: Add library to APF list dynamically.
      ibm.ibm_zos_core.zos_apf:
        library: "{{ library }}"
        sms: true
        force_dynamic: true
      when: library not in apf_list.stdout

    - name: Verify library is now in APF list.
      ibm.ibm_zos_core.zos_apf:
        operation: list
      register: apf_list
      failed_when: library not in apf_list.stdout

    - name: Print APF list for visual verification.
      ansible.builtin.debug:
        var: apf_list.stdout
