- name: Deauthorize library from APF (dynamic).
  hosts: zos_host
  environment: "{{ environment_vars }}"
  gather_facts: false
  tasks:

    - name: Ensure APF list is in dynamic format.
      ibm.ibm_zos_core.zos_apf:
        operation: set_dynamic

    - name: Get APF list for idempotency check.
      ibm.ibm_zos_core.zos_apf:
        operation: list
      register: apf_list

    - name: Remove library from APF list dynamically.
      ibm.ibm_zos_core.zos_apf:
        library: "{{ library }}"
        sms: true
        state: absent
      when: library in apf_list.stdout

    - name: Verify library has been removed from APF list.
      ibm.ibm_zos_core.zos_apf:
        operation: list
      register: apf_list
      failed_when: library in apf_list.stdout

    - name: Print APF list for visual verification.
      ansible.builtin.debug:
        var: apf_list.stdout
